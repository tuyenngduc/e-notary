server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: ENotarySystem

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enotary_db}
    username: ${DB_USERNAME:tuyenngduc}
    password: ${DB_PASSWORD:tuyen123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION}

logging:
  level:
    org.springframework.security: DEBUG
    
app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    # For local development + phone testing on LAN.
    # You can override with APP_CORS_ALLOWED_ORIGINS, e.g.
    #   http://localhost:5173,http://192.168.1.210:5173
    # Supports patterns (when using wildcards) via SecurityConfig/WebSocketConfig.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*:5173,http://192.168.*.*:5173,http://10.*:5173,http://10.*.*.*:5173,http://172.16.*:5173,http://172.17.*:5173,http://172.18.*:5173,http://172.19.*:5173,http://172.2*.*:5173,http://172.3*.*:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@localhost}
    password: ${ADMIN_PASSWORD:DefaultAdmin@123}
  meeting:
    base-url: ${MEETING_BASE_URL:http://localhost:8080}
  payment:
    bank-code: ${PAYMENT_BANK_CODE:MB}
    account-number: ${PAYMENT_ACCOUNT_NUMBER:0000000000}
    account-name: ${PAYMENT_ACCOUNT_NAME:E NOTARY}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@enotary.local}}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:false}
    rpc-url: ${BESU_RPC_URL:http://localhost:8545}
    chain-id: ${BESU_CHAIN_ID:1337}
    network-name: ${BESU_NETWORK_NAME:Hyperledger Besu Local}
    node-name: ${BESU_NODE_NAME:besu-rpc-1}
    sender-private-key: ${BESU_SENDER_PRIVATE_KEY:}
    contract-address: ${BESU_DOCUMENT_ANCHOR_CONTRACT:}
    pq-private-key-path: ${BESU_PQ_PRIVATE_KEY_PATH:}
    pq-public-key-path: ${BESU_PQ_PUBLIC_KEY_PATH:}
    pq-signer-jar: ${BESU_PQ_SIGNER_JAR:}
    pq-java-executable: ${BESU_PQ_JAVA_PATH:java}
    gas-limit: ${BESU_GAS_LIMIT:300000}
    max-priority-fee-per-gas: ${BESU_MAX_PRIORITY_FEE_PER_GAS:0}
    max-fee-per-gas: ${BESU_MAX_FEE_PER_GAS:2000000000}
    receipt-polling-attempts: ${BESU_RECEIPT_POLLING_ATTEMPTS:30}
    receipt-polling-interval-millis: ${BESU_RECEIPT_POLLING_INTERVAL_MS:1000}
